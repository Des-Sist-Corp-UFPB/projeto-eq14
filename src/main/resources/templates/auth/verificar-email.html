<!DOCTYPE html>
<!-- SPEC-12: resultado da verificação de e-mail (link mágico). -->
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Verificação de e-mail — CALADRIUS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <style>
        :root {
            --cal-font: 'Instrument Sans', system-ui, sans-serif;
            --cal-primary: oklch(0.55 0.17 257);
            --cal-bg: oklch(0.98 0.004 250);
            --cal-surface: #ffffff;
            --cal-border: oklch(0.92 0.008 250);
            --cal-text: oklch(0.26 0.03 257);
            --cal-muted: oklch(0.55 0.02 257);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0; font-family: var(--cal-font); background: var(--cal-bg); color: var(--cal-text);
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
        }
        .card {
            width: 400px; max-width: 92vw; background: var(--cal-surface);
            border: 1px solid var(--cal-border); border-radius: 14px; padding: 32px;
            display: flex; flex-direction: column; gap: 20px; text-align: center;
        }
        .logo { display: flex; align-items: center; justify-content: center; gap: 9px; font-weight: 700; letter-spacing: .09em; }
        .logo .dot { width: 16px; height: 16px; border-radius: 5px; background: var(--cal-primary); }
        h1 { font-size: 22px; margin: 0; }
        p.sub { font-size: 14px; color: var(--cal-muted); margin: 0; }
        .badge { font-size: 40px; line-height: 1; }
        a.btn {
            display: inline-block; width: 100%; font-weight: 600; font-size: 14.5px; padding: 11px 16px;
            border-radius: 8px; background: var(--cal-primary); color: #fff; text-decoration: none;
        }
        a { color: var(--cal-primary); text-decoration: none; font-weight: 600; }
    </style>
    <!--
      SEM analytics aqui, de propósito (SPEC-17, RN-ANL-03): esta tela é aberta como
      /verificar-email?token=<segredo> e o rastreador envia a URL da página — o token de
      verificação iria para o servidor de analytics. NÃO adicione o fragmento
      fragments/analytics.
    -->
</head>
<body>
<div class="card">
    <span class="logo"><span class="dot"></span>CALADRIUS</span>

    <div th:if="${ok}">
        <div class="badge">&#9989;</div>
        <h1>E-mail confirmado</h1>
        <p class="sub">Seu e-mail foi verificado com sucesso.</p>
    </div>
    <div th:unless="${ok}">
        <div class="badge">&#9888;&#65039;</div>
        <h1>Link inválido</h1>
        <p class="sub" th:text="${erro} ?: 'O link é inválido ou expirou. Peça um novo.'">Erro</p>
    </div>

    <a class="btn" th:href="@{/login}">Ir para o login</a>
</div>
</body>
</html>
