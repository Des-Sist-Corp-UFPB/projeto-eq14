<!DOCTYPE html>
<!-- SPEC-ACE-03: "esqueci a senha" — card central, escolha do método (E-mail/Telefone) + Enviar. -->
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Recuperar senha — CALADRIUS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <style>
        :root {
            --cal-font: 'Instrument Sans', system-ui, sans-serif;
            --cal-primary: oklch(0.55 0.17 257);
            --cal-bg: oklch(0.98 0.004 250);
            --cal-surface: #ffffff;
            --cal-border: oklch(0.92 0.008 250);
            --cal-text: oklch(0.26 0.03 257);
            --cal-muted: oklch(0.55 0.02 257);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0; font-family: var(--cal-font); background: var(--cal-bg); color: var(--cal-text);
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
        }
        .card {
            position: relative; width: 400px; max-width: 92vw; background: var(--cal-surface);
            border: 1px solid var(--cal-border); border-radius: 14px; padding: 32px;
            display: flex; flex-direction: column; gap: 20px;
        }
        .back {
            position: absolute; top: 14px; left: 14px; width: 34px; height: 34px;
            display: inline-flex; align-items: center; justify-content: center;
            border-radius: 8px; color: var(--cal-muted); text-decoration: none; font-size: 20px;
            border: 1px solid transparent;
        }
        .back:hover { background: var(--cal-bg); border-color: var(--cal-border); }
        .logo { display: flex; align-items: center; gap: 9px; font-weight: 700; letter-spacing: .09em; margin-top: 6px; }
        .logo .dot { width: 16px; height: 16px; border-radius: 5px; background: var(--cal-primary); }
        h1 { font-size: 22px; margin: 0; }
        p.sub { font-size: 14px; color: var(--cal-muted); margin: 0; }
        label.lbl { font-size: 13.5px; font-weight: 600; display: block; margin-bottom: 6px; }
        input.txt {
            width: 100%; font-family: var(--cal-font); font-size: 14.5px; padding: 11px 13px;
            border-radius: 8px; border: 1px solid var(--cal-border); outline: none;
        }
        input.txt:focus { border-color: var(--cal-primary); }
        button {
            width: 100%; font-weight: 600; font-size: 14.5px; padding: 11px 16px; border-radius: 8px;
            border: none; background: var(--cal-primary); color: #fff; cursor: pointer;
        }
        .alert { font-size: 13.5px; padding: 10px 13px; border-radius: 8px; }
        .alert--erro { background: oklch(0.96 0.03 25); color: oklch(0.5 0.17 25); }
        .alert--info { background: oklch(0.95 0.03 255); color: oklch(0.45 0.13 257); }
        a { color: var(--cal-primary); text-decoration: none; font-weight: 600; }

        /* Seletor de método (segmentado, sem JS) */
        .seg { display: flex; gap: 8px; }
        .seg label { flex: 1; margin: 0; position: relative; }
        .seg input { position: absolute; opacity: 0; width: 0; height: 0; }
        .seg span {
            display: block; text-align: center; padding: 10px 12px; border: 1px solid var(--cal-border);
            border-radius: 8px; font-weight: 600; font-size: 13.5px; cursor: pointer; color: var(--cal-text);
        }
        .seg input:checked + span { background: var(--cal-primary); color: #fff; border-color: var(--cal-primary); }
    </style>
    <!-- Analytics de uso (Umami) — SPEC-OPE-02. Inerte sem UMAMI_URL/UMAMI_WEBSITE_ID. -->
    <th:block th:replace="~{fragments/analytics :: umami}"></th:block>
</head>
<body>
<div class="card">
    <a class="back" th:href="@{/login}" title="Voltar ao login" aria-label="Voltar ao login">&#8592;</a>
    <span class="logo"><span class="dot"></span>CALADRIUS</span>
    <div>
        <h1>Recuperar senha</h1>
        <p class="sub">Escolha como receber o código de verificação.</p>
    </div>

    <div th:if="${erro}" class="alert alert--erro" th:text="${erro}">Erro</div>
    <div th:if="${info}" class="alert alert--info" th:text="${info}">Info</div>

    <form th:action="@{/esqueci-senha}" method="post" style="display:flex; flex-direction:column; gap:16px;">
        <div>
            <span class="lbl">Método de verificação</span>
            <div class="seg">
                <label>
                    <input type="radio" name="metodo" value="TELEFONE"
                           th:checked="${metodo == null or metodo.name() == 'TELEFONE'}"/>
                    <span>Telefone</span>
                </label>
                <label>
                    <input type="radio" name="metodo" value="EMAIL"
                           th:checked="${metodo != null and metodo.name() == 'EMAIL'}"/>
                    <span>E-mail</span>
                </label>
            </div>
        </div>
        <div>
            <label class="lbl" for="valor">Seu telefone ou e-mail</label>
            <input class="txt" type="text" id="valor" name="valor" th:value="${valor}"
                   placeholder="(83) 99999-9999 ou voce@exemplo.com" required autofocus/>
        </div>
        <button type="submit">Enviar código</button>
    </form>

    <p class="sub">Lembrou a senha? <a th:href="@{/login}">Entrar</a></p>
</div>
</body>
</html>
