<!DOCTYPE html>
<!--
  Central de logs do sistema (/logs) — item de primeiro nível do menu.

  Diferença para admin/auditoria.html: aqui cada evento carrega a ETIQUETA da área
  que ele tocou (viagens, acesso, WhatsApp…), e a área vira filtro. É a tela que
  responde "o que andaram fazendo em X?", enquanto a categoria responde "que tipo
  de evento é".
-->
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::main})}">
<head><title>Logs do sistema</title></head>
<body>
<main>
    <div class="mb-4">
        <h1 class="h3 mb-1">Logs do sistema</h1>
        <p class="text-muted mb-0">
            Tudo o que acontece no CALADRIUS, com a etiqueta da área tocada. A trilha é
            imutável: registros não são editados nem apagados.
        </p>
    </div>

    <!-- Filtros: área (etiquetas clicáveis) + busca livre -->
    <div class="d-flex flex-wrap gap-3 align-items-start justify-content-between mb-3">
        <div class="d-flex flex-wrap gap-2">
            <a th:href="@{/logs}" class="cal-tag cal-tag--todas"
               th:classappend="${area == null and #strings.isEmpty(busca)} ? 'cal-tag--ativa'">Todas</a>
            <a th:each="a : ${areas}" th:href="@{/logs(area=${a.name()})}"
               class="cal-tag" th:classappend="${'cal-tag--' + a.cor} + (${area != null and area.name() == a.name()} ? ' cal-tag--ativa' : '')"
               th:text="${a.rotulo}">Área</a>
        </div>

        <form th:action="@{/logs}" method="get" style="min-width:260px;">
            <div class="input-group input-group-sm">
                <input type="search" class="form-control" name="busca" th:value="${busca}"
                       placeholder="Buscar ação, usuário, detalhe…" aria-label="Buscar nos logs"/>
                <button class="btn btn-outline-secondary" type="submit">Buscar</button>
            </div>
        </form>
    </div>

    <div class="card">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th style="width:150px">Quando</th>
                            <th style="width:130px">Área</th>
                            <th>Ação</th>
                            <th>Usuário</th>
                            <th>Detalhe</th>
                            <th style="width:110px">Resultado</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="log : ${logs.content}">
                            <td class="small text-nowrap text-muted"
                                th:text="${#temporals.format(log.instante, 'dd/MM/yyyy HH:mm')}">—</td>
                            <td>
                                <span class="cal-tag" th:classappend="${'cal-tag--' + log.area.cor}"
                                      th:text="${log.area.rotulo}">Área</span>
                            </td>
                            <td class="small fw-semibold" th:text="${log.acao}">ACAO</td>
                            <td class="small" th:text="${log.usuarioNome ?: '—'}">—</td>
                            <td class="small text-muted" style="max-width:420px; white-space:normal;"
                                th:text="${log.detalhe ?: (log.entidade ?: '—')}">—</td>
                            <td>
                                <span class="badge"
                                      th:classappend="${log.resultado == 'FALHA'} ? 'bg-danger-subtle text-danger-emphasis' : 'bg-success-subtle text-success-emphasis'"
                                      th:text="${log.resultado}">—</span>
                            </td>
                        </tr>
                        <tr th:if="${logs.content.empty}">
                            <td colspan="6" class="text-center text-muted py-5">
                                Nenhum evento para este filtro.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <nav th:if="${logs.totalPages > 1}" class="mt-3">
                <ul class="pagination pagination-sm justify-content-center mb-0">
                    <li class="page-item" th:classappend="${logs.first} ? 'disabled'">
                        <a class="page-link"
                           th:href="@{/logs(pagina=${paginaAtual - 1}, area=${area?.name()}, busca=${busca})}">&laquo;</a>
                    </li>
                    <li th:each="i : ${#numbers.sequence(0, logs.totalPages - 1)}"
                        class="page-item" th:classappend="${i == paginaAtual} ? 'active'">
                        <a class="page-link"
                           th:href="@{/logs(pagina=${i}, area=${area?.name()}, busca=${busca})}"
                           th:text="${i + 1}">1</a>
                    </li>
                    <li class="page-item" th:classappend="${logs.last} ? 'disabled'">
                        <a class="page-link"
                           th:href="@{/logs(pagina=${paginaAtual + 1}, area=${area?.name()}, busca=${busca})}">&raquo;</a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>
</main>
</body>
</html>
