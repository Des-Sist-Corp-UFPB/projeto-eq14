<!DOCTYPE html>
<!-- Adesão ao pagamento por município (SYSADMIN) — SPEC-PLT-01, FR-FLG-03. -->
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::main})}">
<head><title>Adesão ao pagamento</title></head>
<body>
<main th:attr="hx-headers='{&quot;' + ${_csrf.headerName} + '&quot;: &quot;' + ${_csrf.token} + '&quot;}'">

    <div class="mb-4">
        <h1 class="h3 mb-1">Adesão ao pagamento</h1>
        <p class="text-muted mb-0">
            Só municípios marcados aqui entram no (futuro) fluxo de pagamento — a avaliação é
            feita pelo município de origem do passageiro (endereço).
        </p>
    </div>

    <form class="mb-3" th:action="@{/admin/municipios}" method="get" style="max-width: 420px;">
        <div class="input-group">
            <input type="search" class="form-control" name="busca" th:value="${busca}"
                   placeholder="Buscar município…" aria-label="Buscar município"/>
            <button class="btn btn-outline-secondary" type="submit">Buscar</button>
        </div>
    </form>

    <div class="card">
        <div class="card-body">
            <div th:replace="~{admin/fragments/municipios :: tabela}"></div>
        </div>
    </div>

    <p class="mt-3">
        <a th:href="@{/admin/features}" class="link-secondary small">← Voltar para Funcionalidades</a>
    </p>

</main>
</body>
</html>
